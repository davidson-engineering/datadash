name: default
description: Original dashboard theme
dashboard_title: Dashboard

# Palette assignments for trace coloring
palettes:
  primary: 'rgb'      # Default palette for most traces
  secondary: 'space'     # Secondary palette for complementary data
  tertiary: 'winter'      # Tertiary palette for additional data

colors:
  primary_bg: &color_primary_bg "#ffffff"
  secondary_bg: &color_secondary_bg "#f8f9fa"
  text_primary: &color_text_primary "#4b4d51"
  text_secondary: &color_text_secondary "#6e7073"
  border: &color_border "#dee2e6"
  accent: &color_accent "#343538"

global-styles:
  border:
    bars: &border_style "1.25px solid #dee2e6"
    dropdown: &dropdown_border "0.75px solid #dee2e6"
  # box_shadow:
    # upper: &upper-shadow "0px 6px 10px 0px #000000 inset"
    # main: &main-shadow "0px -4px 6px 0px rgba(0, 0, 0, 0.1) inset, 0px 4px 6px 0px rgba(0, 0, 0, 0.1) inset"
    # footer: &footer-shadow "0px -6px 10px 0px #000000 inset"

fonts:
  monospace: &monospace_font "'DroidSansMonoNerdFontMono', monospace"
  sans: &sans_font "sans-serif"
  title: &title_font "'DroidSansMonoNerdFontPropo', monospace"
  tab: &tab_font "'DroidSansMonoNerdFontPropo', monospace"
  body: &body_font "'DroidSansMonoNerdFontPropo', monospace"
  plots: &plots_font "DroidSansMonoNerdFontPropo, monospace"
  footer: &footer_font "'DroidSansMonoNerdFontPropo', monospace"
  table: &table_font "'DroidSansMonoNerdFontPropo', monospace"
  hoverlabels: &hoverlabels_font "DroidSansMonoNerdFontPropo, monospace"
  dropdown: &dropdown_font "'DroidSansMonoNerdFontPropo', monospace"

icons:
  tabs:
    robot-overview: ""
    actuator-dynamics: ""
    actuator-loads: ""
    end-effector-trajectory-spatial: ""
    joint-trajectories: ""
    end-effector-trajectory: ""
    summary-specifications: ""
    results-table: ""
    job-selector: ""

styles:
  header:
    textAlign: center
    fontFamily: *title_font
    fontSize: "clamp(1.5rem, 4vw, 2.5rem)"
    fontWeight: 600
    color: *color_text_primary
    padding: "1rem 1rem 0.5rem"
    flex-shrink: 0
    background: *color_secondary_bg
    margin-bottom: 0px
    text-transform: unset
    letter-spacing: "clamp(0.2rem, 1.2vw, 0.8rem)"

  tab: &tab_style
    background: *color_primary_bg
    color: *color_text_secondary
    # Longhand border properties: mixing the `border` shorthand with the
    # selected tab's `borderColor` made React drop the colour, so dcc's own tab
    # CSS showed through (a dark right edge on inactive tabs).
    borderWidth: 1.25px
    borderStyle: solid
    borderColor: *color_border
    borderRadius: 18px
    padding: "0.5rem 1rem"
    fontFamily: *tab_font
    fontWeight: 500
    fontSize: 1rem
    display: "flex"
    alignItems: center
    justifyContent: center
    textAlign: center
    lineHeight: 1.25
    minHeight: "3.5rem"
    # Wide enough for "END EFFECTOR" on one line, so labels wrap to at most two
    # lines; never narrower than the longest single word ("SPECIFICATIONS").
    flex: "1 0 10rem"
    minWidth: "min-content"
    maxWidth: "12rem"

  tab_selected:
    <<: *tab_style
    background: *color_accent
    borderColor: *color_accent
    color: "#ffffff"

  tab_container:
    background: *color_secondary_bg
    margin: 0rem
    padding: "0.25rem 1rem 0.75rem"
    gap: 0.75rem
    display: flex
    # Wrap onto further rows when the tabs don't fit, so every tab stays visible
    flexWrap: wrap
    justifyContent: center
    flex-shrink: 0
    border-bottom: *border_style

  body_container:
    background: *color_primary_bg
    height: 100%
    margin: 0px
    fontFamily: *body_font
    display: flex
    flexDirection: column
    min-height: 100vh
    overflow: hidden  # prevent outer scroll
    
  main_container:
    background: *color_primary_bg
    flex: 1 0 auto
    width: 100%
    maxWidth: 1680px
    margin: "0 auto"
    padding: "1.5rem 1.5rem 2rem"
    overflow-x: hidden
    flex-direction: column

  graph_container:
    background: *color_primary_bg
    margin-top: 0px
    flex: 1 1 auto
    overflow-y: auto
    gap: 0rem
    # width: 100%
    # height: 100%
    # max-width: 1200px
    # min-width: 600px

  table_container:
    background: *color_primary_bg
    width: 100%
    maxWidth: 1200px
    margin: "0 auto"
    maxHeight: 70vh
    overflowY: auto
    # Wide tables scroll inside their container on narrow screens, not the page
    overflowX: auto
    
  table_header:
    backgroundColor: *color_secondary_bg
    color: *color_text_primary
    fontFamily: *table_font
    fontWeight: 600
    padding: "0.5rem 0.75rem"
    border: "none"
    borderBottom: *border_style

  table_cell:
    fontFamily: *table_font
    color: *color_text_primary
    padding: "0.35rem 0.75rem"
    border: "none"
    borderBottom: *dropdown_border
    whiteSpace: normal
    height: auto

  # The caption over each section of a table (construct_dash_table's group_by).
  # Bootstrap pads captions above and below, and greys them out
  table_section:
    fontFamily: *table_font
    color: *color_text_primary
    fontWeight: 600
    textAlign: left
    margin: "1.5rem 0 0.5rem"
    paddingTop: 0
    paddingBottom: 0

  footer:
    width: 100%
    textAlign: center
    padding: 1rem
    background: *color_secondary_bg
    color: *color_text_secondary
    borderTop: *border_style
    fontFamily: *footer_font
    fontWeight: 400
    fontSize: 1.2rem
    lineHeight: 1.25
    flex-shrink: 0
    # box-shadow: *footer-shadow

  dropdown-container:
    color: *color_text_primary
    background: *color_primary_bg
    width: 100%
    maxWidth: 1680px
    margin: "0 auto"
    padding: "1rem 1.5rem 0"
    flex-shrink: 0

  dropdown-label:
    display: block
    fontSize: 0.85rem
    fontWeight: 500
    color: *color_text_secondary
    marginBottom: 0.25rem
    whiteSpace: nowrap
    overflow: hidden
    textOverflow: ellipsis

  dropdown:
    background: *color_secondary_bg
    fontFamily: *dropdown_font
    fontSize: 1rem
    border: *dropdown_border
    borderRadius: 8px
    # dcc.Dropdown colors its button and menu from these variables, which
    # cascade from this style (see assets/dash-components.css)
    "--Dash-Fill-Interactive-Strong": *color_accent
    "--Dash-Stroke-Strong": *color_border
    "--Dash-Text-Strong": *color_text_primary

plotly:
  layout:
    paper_bgcolor: "#ffffff"
    plot_bgcolor: "#ffffff"
    font:
      family: *plots_font
      size: 14
      color: *color_text_primary
    autosize: True
    # Title and legend positions are fixed in pixels from the top (via the top
    # margin) rather than as a fraction of figure height, so titles line up
    # across a row of charts.
    title:
      yref: container
      y: 0.98
      x: 0.5
      xanchor: center
      yanchor: top
    margin: {l: 70, r: 70, t: 76, b: 60}
    legend:
      orientation: h
      x: 0.5
      xanchor: center
      y: 1.02
      yanchor: bottom
      font:
        size: 12
      bgcolor: "rgba(0,0,0,0)"
    xaxis:
      gridcolor: "#dee2e6"
      color: *color_text_primary
      linecolor: "#dee2e6"
      tickcolor: "#dee2e6"
      zerolinecolor: "#777777"
      zerolinewidth: 2
      title:
        font:
          weight: 400
      tickfont:
        weight: 400
    yaxis:
      gridcolor: "#dee2e6"
      color: *color_text_primary
      linecolor: "#dee2e6"
      tickcolor: "#dee2e6"
      zeroline: True
      zerolinecolor: "#777777"
      zerolinewidth: 2
      title:
        font:
          weight: 400
      tickfont:
        weight: 400
    yaxis2:
      zeroline: False
    showlegend: True
    scene:
      xaxis:
        gridcolor: "#dee2e6"
        backgroundcolor: "#ffffff"
        color: *color_text_primary
        autorange: False
        showgrid: True
        tick0: 0          # start of ticks
        dtick: 0.1        # spacing between ticks
      yaxis:
        gridcolor: "#dee2e6"
        backgroundcolor: "#ffffff"
        color: *color_text_primary
        showgrid: True
        autorange: False
        tick0: 0          # start of ticks
        dtick: 0.1        # spacing between ticks
      zaxis:
        gridcolor: "#dee2e6"
        backgroundcolor: "#ffffff"
        color: *color_text_primary
        showgrid: True
        autorange: False
        tick0: 0          # start of ticks
        dtick: 0.1        # spacing between ticks
      # aspectmode: manual
      # aspectratio: {x: 1, y: 1, z: 1}
    hoverlabel:
      font_size: 12
      font_family: *hoverlabels_font

  traces:
    default:
      marker: 
        size: 8
      line: 
        width: 3
      line_shape: spline
      mode: lines+markers
      visible: true
      hovertemplate: "%{y:.3f}"

    traj:
      mode: lines
    traj.spatial:
      marker: 
        # line:
        #   width: 4
        #   colorscale: "Viridis"
        colorscale: "Viridis"
        size: 6
        # symbol: x-thin
    traj.spatial.3d:
      marker: 
        # line:
        #   width: 4
        #   colorscale: "Viridis"
        colorscale: "Viridis"
        size: 4
        # symbol: x
        colorbar: {"title": "Velocity [m·s<sup>-1</sup>]"}
        


    actuator:
      mode: lines
      hovertemplate: "%{y:.2f}"

    actuator.tn_curve:
      marker:
        line:
          width: 2
        size: 6
        symbol: x-thin
      line:
        width: 1
      line_shape: spline
      mode: markers+lines
      hovertemplate: "%{y:.2f}"

    # Robot-specific trace properties
    nacelle:
      marker: 
        size: 5
        color: "#6c757d"
      line: 
        color: "#6c757d"
        width: 5
      surfacecolor: "rgba(108,117,125,0.1)"
      surfaceaxis: 2
      visible: true
    base:
      marker: 
        size: 6
        color: "#495057"
      line: 
        color: "#495057"
        width: 8
      surfacecolor: "rgba(73,80,87,0.1)"
      surfaceaxis: 2
      visible: true
    proximal:
      marker: 
        size: 8
        color: "#007bff"
      line: 
        color: "#007bff"
        width: 7
      visible: true
    distal:
      marker: 
        size: 3
        color: "#17a2b8"
      line: 
        color: "#17a2b8"
        width: 4
      visible: true
    trajectory:
      marker: 
        size: 3
        color: "#28a745"
      line: 
        color: "#28a745"
        width: 2
      mode: lines
      visible: true
    trajectory_center:
      marker: 
        size: 4
        color: "#ffc107"
      line: 
        color: "#28a745"
        width: 2
      mode: markers
      visible: true
    limit.min:
      line: 
        color: "#dc3545"
        width: 5
        dash: dash
      mode: lines
      visible: true
    limit.max:
      line: 
        color: "#6c757d"
        width: 5
        dash: dash
      mode: lines
      visible: true
    envelope:
      marker: 
        size: 3
        color: "#28a745"
      line: 
        color: "#28a745"
        width: 2
      mode: lines
      visible: true
    end_effector:
      marker: 
        size: 5
        color: "#495057"
      line: 
        color: "#495057"
        width: 7
      visible: true
    CoG:
      marker:
        size: 4
        color: "#000000"
        symbol: circle
      mode: markers
      visible: true
    trajectory.path:
      marker: 
        size: 3
        color: "#28a745"
      line: 
        color: "#28a745"
        width: 3
      mode: lines
      visible: true
    trajectory.end_effector:
      marker: 
        size: 6
        color: "#000000"
      line: 
        color: "#000000"
        width: 3
      mode: lines
      visible: false

settings:
  debug_mode: false
  pattern_properties_enable: false
  trace_resolution_default: 400
  trace_margin: 0.15
  pattern_properties_enable: true
  pattern_properties_lookup: [yaxis, xaxis]
  pattern_properties_exclusions: [zaxis]
  symmetrical_yaxis: false
  animation_frame_rate: 20
  animation_duration: 1.0