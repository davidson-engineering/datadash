[project]
name = "datadash"
version = "0.3.0"
description = "Themed Plotly figure builders and Dash dashboard components"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash>=4.4.1",
    "dash-bootstrap-components>=2.0.4",
    "matplotlib>=3.10.6",
    "mergedeep>=1.3.4",
    "numpy>=2.3.3",
    "plotly>=7.1.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
# construct_dash_table duck-types DataFrames; its tests build real ones
dev = [
    "pandas>=2.3.3",
    "pytest>=8.4.2",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datadash"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
