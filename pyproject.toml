[project]
name = "datadash"
version = "0.6.3"
description = "Themed Plotly figure builders and Dash dashboard components"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash>=4.4.1",
    "dash-bootstrap-components>=2.0.4",
    "matplotlib>=3.10.6",
    "mergedeep>=1.3.4",
    "numpy>=2.3.3",
    "plotly>=7.1.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
# construct_dash_table duck-types DataFrames; its tests build real ones. The
# tests of the page scripts in assets/ drive Chromium with Playwright
# (uv run playwright install chromium)
dev = [
    "pandas>=2.3.3",
    "playwright>=1.63.0",
    "pyright[nodejs]==1.1.414",
    "pytest>=8.4.2",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datadash"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.pyright]
include = ["datadash", "tests"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
