[project]
name = "datadash"
version = "0.0.1"
description = "Themed Plotly figure builders and Dash dashboard components"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash>=3.2.0",
    "dash-bootstrap-components>=2.0.4",
    "matplotlib>=3.10.6",
    "mergedeep>=1.3.4",
    "numpy>=2.3.3",
    "plotly>=6.3.0",
    "pyyaml>=6.0.3",
    "redis>=6.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datadash"]
